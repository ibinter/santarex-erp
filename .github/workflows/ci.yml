name: CI — SANTAREX ERP

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Tests backend ──────────────────────────────────────────────────────────
  test-backend:
    name: Tests Backend (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm run test:ci
        env:
          JWT_SECRET: test-secret-for-ci-only
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only
          NODE_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  # ─── Parcours complet : serveur réel + base PostgreSQL jetable ───────────────
  # Inscription, connexion, patient, facture, paiements, isolation entre
  # établissements, double authentification. Voir backend/test/journey.js.
  journey:
    name: Parcours complet (API + base réelle)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: santarex
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: santarex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U santarex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: santarex
      DB_PASSWORD: ci_password
      DB_NAME: santarex_ci
      JWT_SECRET: test-secret-for-ci-only
      JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only
      BACKEND_PORT: 3001

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Démarrer le serveur
        run: |
          nohup node dist/main > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3001/api/v1/health > /dev/null; then echo "serveur prêt après ${i}s"; exit 0; fi
            sleep 1
          done
          echo "Le serveur n'a pas démarré en 60 s"; tail -50 server.log; exit 1

      - name: Parcours complet
        run: node test/journey.js
        env:
          BASE: http://localhost:3001/api/v1

      - name: Journal du serveur (en cas d'échec)
        if: failure()
        run: tail -150 server.log

  # ─── Build frontend ─────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://santarex.ibigsoft.com/api/v1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 1

  # ─── Tests E2E Playwright (sur PR uniquement) ────────────────────────────────
  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3003

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
